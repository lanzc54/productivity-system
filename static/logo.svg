<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="USSC internal audit logo">
  <defs>
    <linearGradient id="ringOuter" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d2d52"/>
      <stop offset="100%" stop-color="#123d68"/>
    </linearGradient>
    <linearGradient id="ringInner" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e94b3c"/>
      <stop offset="100%" stop-color="#d84b3f"/>
    </linearGradient>
  </defs>

  <circle cx="110" cy="110" r="106" fill="url(#ringOuter)"/>
  <circle cx="110" cy="110" r="90" fill="#f5f6f2"/>
  <circle cx="110" cy="110" r="82" fill="none" stroke="url(#ringInner)" stroke-width="10"/>

  <g fill="#173d5e" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="110" y="79" font-size="28" font-weight="700" letter-spacing="2">USSC</text>
    <text x="110" y="150" font-size="11" font-weight="700" letter-spacing="1.5">INTERNAL AUDIT</text>
  </g>

  <g fill="#173d5e" stroke="#173d5e" stroke-width="2">
    <circle cx="110" cy="38" r="4"/>
    <circle cx="170" cy="58" r="4"/>
    <circle cx="188" cy="110" r="4"/>
    <circle cx="170" cy="162" r="4"/>
    <circle cx="110" cy="182" r="4"/>
    <circle cx="50" cy="162" r="4"/>
    <circle cx="32" cy="110" r="4"/>
    <circle cx="50" cy="58" r="4"/>
  </g>

  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="110" y="118" font-size="44" font-weight="700">IA</text>
  </g>
</svg>
