name: Nightly Postgres Backup

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pg_dump
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Dump Postgres and upload to S3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -e
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          FILENAME="productivity-backup-$TIMESTAMP.dump"
          echo "Creating dump $FILENAME"
          pg_dump "$DATABASE_URL" -Fc -f "$FILENAME"
          echo "Uploading to s3://$S3_BUCKET/$FILENAME"
          aws s3 cp "$FILENAME" "s3://$S3_BUCKET/$FILENAME"

      - name: Cleanup
        run: rm -f productivity-backup-*.dump || true
